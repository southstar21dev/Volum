<!doctype html>
<!-- Published to GitHub Pages by .github/workflows/release.yml, next to altstore.json and altstore-beta.json. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Volum</title>
  <style>
    :root { --accent: #1F4D33; --accent-top: #3E7354; --ink: #14201A; --muted: #5B6B62; --bg: #EEF2EF; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink);
      background: radial-gradient(120% 80% at 20% 0%, #DCE8E0 0%, var(--bg) 55%), var(--bg);
    }
    main {
      width: 100%; max-width: 420px; padding: 32px 24px; border-radius: 32px; text-align: center;
      background: linear-gradient(180deg, rgba(255,255,255,.85), rgba(255,255,255,.55));
      border: 1px solid rgba(255,255,255,.9);
      box-shadow: 0 20px 50px -20px rgba(31,77,51,.35), inset 0 1px 0 rgba(255,255,255,.9);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    }
    img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 10px 24px -10px rgba(31,77,51,.6); }
    h1 { margin: 16px 0 4px; font-size: 28px; letter-spacing: -.02em; }
    p { margin: 0 0 24px; color: var(--muted); }
    h2 { margin: 24px 0 10px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    a.button {
      display: block; margin: 10px 0; padding: 14px 18px; border-radius: 999px; text-decoration: none; font-weight: 600;
      color: #fff; background: linear-gradient(180deg, var(--accent-top), var(--accent));
      box-shadow: 0 8px 20px -8px rgba(31,77,51,.7), inset 0 1px 0 rgba(255,255,255,.25);
    }
    a.button.secondary { color: var(--accent); background: rgba(31,77,51,.08); box-shadow: inset 0 0 0 1px rgba(31,77,51,.15); }
    small { display: block; margin-top: 20px; color: var(--muted); word-break: break-all; }
    small a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <img src="https://raw.githubusercontent.com/southstar21dev/Volum/master/iosApp/iosApp/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png" alt="Volum app icon" />
    <h1>Volum</h1>
    <p>A strength training log.</p>

    <h2>iPhone</h2>
    <a class="button" id="altstore" href="#">Add to AltStore</a>
    <a class="button" id="sidestore" href="#">Add to SideStore</a>
    <a class="button secondary" id="sidestore-beta" href="#">SideStore, with release candidates</a>

    <h2>Android</h2>
    <a class="button" href="https://apps.obtainium.imranr.dev/redirect?r=obtainium://add/https://github.com/southstar21dev/Volum">Add to Obtainium</a>
    <a class="button secondary" href="https://github.com/southstar21dev/Volum/releases/latest">Download the APK</a>

    <small>Source URL: <a id="source-url" href="altstore.json">altstore.json</a></small>
  </main>
  <script>
    const base = new URL(".", location.href).href;
    const stable = base + "altstore.json";
    const beta = base + "altstore-beta.json";
    document.getElementById("altstore").href = "altstore://source?url=" + encodeURIComponent(stable);
    document.getElementById("sidestore").href = "sidestore://source?url=" + encodeURIComponent(stable);
    document.getElementById("sidestore-beta").href = "sidestore://source?url=" + encodeURIComponent(beta);
    const link = document.getElementById("source-url");
    link.textContent = stable;
    link.href = stable;
  </script>
</body>
</html>
