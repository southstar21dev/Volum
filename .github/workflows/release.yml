name: Release

# Each push to master can publish a release (v1.2.0). The shared tests run first, on the pushed commit;
# CI runs alongside and nothing links the two. semantic-release then picks the version from the commits
# since the last tag; if any warrant one, it builds the signed APK and the unsigned IPA, tags the commit
# and publishes a GitHub Release with the changelog and both files.
# Obtainium (Android) watches the releases directly; AltStore/SideStore (iOS) read the sources the
# second job publishes to GitHub Pages.
on:
  push:
    branches: [master]
    # The server (backend/) deploys separately; a push that only touches it is not an app release.
    paths-ignore: ["backend/**"]
  # Republishes the AltStore/SideStore sources without releasing, e.g. after editing a release.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    if: github.event_name == 'push'
    # macOS: the IPA needs Xcode. The image also has the Android SDK for the APK.
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release reads every tag and commit
          # semantic-release pushes the tag with GITHUB_TOKEN from the environment, through its own
          # authenticated remote URL, so the build steps don't need the token left in .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Same as in CI: the Kotlin/Native toolchain isn't in the Gradle home, so cache it separately.
      - name: Kotlin version
        id: kotlin
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}

      # The release build script only assembles; these are the tests CI runs, so a commit whose tests
      # fail is never tagged or published.
      - name: Shared tests
        run: ./gradlew :shared:testAndroidHostTest :shared:iosSimulatorArm64Test --continue --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-test-reports
          path: "**/build/reports/tests/"
          retention-days: 7

      - name: Install semantic-release
        run: npm ci

      - name: Install XcodeGen
        run: scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. See docs/RELEASING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "VOLUM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build, tag and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VOLUM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          VOLUM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          VOLUM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: npx semantic-release

      - name: Remove the release key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  altstore-source:
    name: AltStore/SideStore sources
    needs: release
    # Runs after every release attempt, cheap even when nothing was released. GitHub Pages needs a
    # public repo on the free plan, so this skips while the repo is private.
    if: ${{ !cancelled() && !github.event.repository.private && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}altstore.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Build the sources from the GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/altstore-source.mjs site
          cp docs/site/index.html site/

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
