name: Set up Kotlin/Native
description: JDK 17, Gradle with its caches, and a cached ~/.konan for jobs that build the iOS side.

# setup-gradle caches ~/.gradle but not ~/.konan, so without this every macOS job re-downloads the
# Kotlin/Native toolchain (LLVM, sysroot, ~2 GB unpacked) and rebuilds the platform-library caches
# before compiling anything. The toolchain only changes with the Kotlin version, so that's the key.
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17

    - uses: gradle/actions/setup-gradle@v6

    - id: kotlin
      shell: bash
      run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      with:
        path: ~/.konan
        key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}
