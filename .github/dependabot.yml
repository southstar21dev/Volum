version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      androidx:
        patterns: ["androidx.*", "org.jetbrains.androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*"]
      compose:
        patterns: ["org.jetbrains.compose*"]
      ktor:
        patterns: ["io.ktor*"]

  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"] # the workflows and the composite actions they use
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
    groups:
      semantic-release:
        patterns: ["*"]
